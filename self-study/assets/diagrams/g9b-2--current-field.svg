<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="電流的磁效應與電磁鐵"><rect width="960" height="560" fill="#ffffff"></rect><rect width="6" height="44" x="28" y="25" rx="3" ry="3" fill="#087f83"></rect><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="25" font-weight="700" fill="#17324d" x="48" y="48" text-anchor="start" style="font-size:25px;fill:#17324d;font-weight:700">電流的磁效應與電磁鐵</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="500" fill="#52677d" x="48" y="78" text-anchor="start" style="font-size:16px;fill:#52677d;font-weight:500">先比較相同條件，再找差異</text><rect width="278" height="302" x="34" y="128" rx="16" ry="16" fill="#f5f9fc" stroke-width="1" stroke="#dce6ee"></rect><circle r="14" cx="60" cy="156" fill="#087f83"></circle><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="700" fill="white" x="60" y="162" text-anchor="middle" style="font-size:16px;fill:white;font-weight:700">1</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19" font-weight="500" fill="#17324d" x="83" y="163" text-anchor="start" style="font-size:19px;fill:#17324d;font-weight:500">直線右手握拳</text><line x1="56" y1="190" x2="290" y2="190" stroke-linecap="round" stroke-width="1" stroke="#bdcddd"></line><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18" font-weight="500" fill="#52677d" x="56" y="224" text-anchor="start" style="font-size:18px;fill:#52677d;font-weight:500">拇指為電流，四指繞行為磁場</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18" font-weight="500" fill="#52677d" x="56" y="252.8" text-anchor="start" style="font-size:18px;fill:#52677d;font-weight:500">，不可把拇指誤當受力。</text><rect width="278" height="302" x="341" y="128" rx="16" ry="16" fill="#f5f9fc" stroke-width="1" stroke="#dce6ee"></rect><circle r="14" cx="367" cy="156" fill="#087f83"></circle><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="700" fill="white" x="367" y="162" text-anchor="middle" style="font-size:16px;fill:white;font-weight:700">2</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19" font-weight="500" fill="#17324d" x="390" y="163" text-anchor="start" style="font-size:19px;fill:#17324d;font-weight:500">線圈右手握拳</text><line x1="363" y1="190" x2="597" y2="190" stroke-linecap="round" stroke-width="1" stroke="#bdcddd"></line><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18" font-weight="500" fill="#52677d" x="363" y="224" text-anchor="start" style="font-size:18px;fill:#52677d;font-weight:500">四指沿電流繞向，拇指所指的</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18" font-weight="500" fill="#52677d" x="363" y="252.8" text-anchor="start" style="font-size:18px;fill:#52677d;font-weight:500">那一端是 N 極。</text><rect width="278" height="302" x="648" y="128" rx="16" ry="16" fill="#f5f9fc" stroke-width="1" stroke="#dce6ee"></rect><circle r="14" cx="674" cy="156" fill="#087f83"></circle><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="700" fill="white" x="674" y="162" text-anchor="middle" style="font-size:16px;fill:white;font-weight:700">3</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19" font-weight="500" fill="#17324d" x="697" y="163" text-anchor="start" style="font-size:19px;fill:#17324d;font-weight:500">實驗公平性</text><line x1="670" y1="190" x2="904" y2="190" stroke-linecap="round" stroke-width="1" stroke="#bdcddd"></line><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18" font-weight="500" fill="#52677d" x="670" y="224" text-anchor="start" style="font-size:18px;fill:#52677d;font-weight:500">比較匝數時保持電流、鐵芯、</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18" font-weight="500" fill="#52677d" x="670" y="252.8" text-anchor="start" style="font-size:18px;fill:#52677d;font-weight:500">線圈尺寸及測試方法相同。</text><line x1="32" y1="475" x2="928" y2="475" stroke-linecap="round" stroke-width="2" stroke="#bdcddd"></line><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19" font-weight="600" fill="#17324d" x="40" y="507" text-anchor="start" style="font-size:19px;fill:#17324d;font-weight:600">用自己的話說明每一格之間的關係。</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="500" fill="#52677d" x="40" y="538" text-anchor="start" style="font-size:16px;fill:#52677d;font-weight:500">箭頭表示順序或因果；並不代表物質必定只往單一方向變化。</text></svg>