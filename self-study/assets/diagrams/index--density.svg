<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="同體積比較質量，理解密度"><rect width="960" height="560" fill="#ffffff"></rect><rect width="6" height="44" x="28" y="25" rx="3" ry="3" fill="#087f83"></rect><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="25" font-weight="700" fill="#17324d" x="48" y="48" text-anchor="start" style="font-size:25px;fill:#17324d;font-weight:700">同體積比較質量，理解密度</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="500" fill="#52677d" x="48" y="78" text-anchor="start" style="font-size:16px;fill:#52677d;font-weight:500">觀察圖中的標示，再對照下方重點</text><rect width="424" height="316" x="38" y="122" rx="16" ry="16" fill="#f5f9fc" stroke-width="1" stroke="#dce6ee"></rect><circle r="14" cx="64" cy="150" fill="#087f83"></circle><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="700" fill="white" x="64" y="156" text-anchor="middle" style="font-size:16px;fill:white;font-weight:700">1</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19" font-weight="500" fill="#17324d" x="87" y="157" text-anchor="start" style="font-size:19px;fill:#17324d;font-weight:500">體積相同</text><rect width="115" height="115" x="105" y="214" rx="6" ry="6" fill="#e0effa" stroke-width="2" stroke="#176ca4"></rect><circle r="6" cx="124" cy="237" fill="#176ca4" stroke-width="2" stroke="white"></circle><circle r="6" cx="154" cy="237" fill="#176ca4" stroke-width="2" stroke="white"></circle><circle r="6" cx="184" cy="237" fill="#176ca4" stroke-width="2" stroke="white"></circle><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17" font-weight="500" fill="#17324d" x="162.5" y="367" text-anchor="middle" style="font-size:17px;fill:#17324d;font-weight:500">質量較小</text><rect width="115" height="115" x="295" y="214" rx="6" ry="6" fill="#d8eeec" stroke-width="2" stroke="#087f83"></rect><circle r="6" cx="314" cy="237" fill="#087f83" stroke-width="2" stroke="white"></circle><circle r="6" cx="344" cy="237" fill="#087f83" stroke-width="2" stroke="white"></circle><circle r="6" cx="374" cy="237" fill="#087f83" stroke-width="2" stroke="white"></circle><circle r="6" cx="314" cy="267" fill="#087f83" stroke-width="2" stroke="white"></circle><circle r="6" cx="344" cy="267" fill="#087f83" stroke-width="2" stroke="white"></circle><circle r="6" cx="374" cy="267" fill="#087f83" stroke-width="2" stroke="white"></circle><circle r="6" cx="314" cy="297" fill="#087f83" stroke-width="2" stroke="white"></circle><circle r="6" cx="344" cy="297" fill="#087f83" stroke-width="2" stroke="white"></circle><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17" font-weight="500" fill="#17324d" x="352.5" y="367" text-anchor="middle" style="font-size:17px;fill:#17324d;font-weight:500">質量較大</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17" font-weight="500" fill="#52677d" x="250" y="414" text-anchor="middle" style="font-size:17px;fill:#52677d;font-weight:500">粒子種類不同可造成密度不同</text><rect width="424" height="316" x="500" y="122" rx="16" ry="16" fill="#f5f9fc" stroke-width="1" stroke="#dce6ee"></rect><circle r="14" cx="526" cy="150" fill="#087f83"></circle><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="700" fill="white" x="526" y="156" text-anchor="middle" style="font-size:16px;fill:white;font-weight:700">2</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19" font-weight="500" fill="#17324d" x="549" y="157" text-anchor="start" style="font-size:19px;fill:#17324d;font-weight:500">同一材質切割</text><rect width="115" height="115" x="567" y="214" rx="6" ry="6" fill="#e0effa" stroke-width="2" stroke="#176ca4"></rect><circle r="6" cx="586" cy="237" fill="#176ca4" stroke-width="2" stroke="white"></circle><circle r="6" cx="616" cy="237" fill="#176ca4" stroke-width="2" stroke="white"></circle><circle r="6" cx="646" cy="237" fill="#176ca4" stroke-width="2" stroke="white"></circle><circle r="6" cx="586" cy="267" fill="#176ca4" stroke-width="2" stroke="white"></circle><circle r="6" cx="616" cy="267" fill="#176ca4" stroke-width="2" stroke="white"></circle><circle r="6" cx="646" cy="267" fill="#176ca4" stroke-width="2" stroke="white"></circle><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17" font-weight="500" fill="#17324d" x="624.5" y="367" text-anchor="middle" style="font-size:17px;fill:#17324d;font-weight:500">原來的物體</text><rect width="57.5" height="115" x="757" y="214" rx="6" ry="6" fill="#d8eeec" stroke-width="2" stroke="#087f83"></rect><circle r="6" cx="785" cy="237" fill="#087f83" stroke-width="2" stroke="white"></circle><circle r="6" cx="785" cy="267" fill="#087f83" stroke-width="2" stroke="white"></circle><circle r="6" cx="785" cy="297" fill="#087f83" stroke-width="2" stroke="white"></circle><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17" font-weight="500" fill="#17324d" x="785.75" y="367" text-anchor="middle" style="font-size:17px;fill:#17324d;font-weight:500">一半質量／一半體積</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17" font-weight="500" fill="#52677d" x="712" y="414" text-anchor="middle" style="font-size:17px;fill:#52677d;font-weight:500">質量和體積同比例減少</text><line x1="32" y1="475" x2="928" y2="475" stroke-linecap="round" stroke-width="2" stroke="#bdcddd"></line><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19" font-weight="600" fill="#17324d" x="40" y="507" text-anchor="start" style="font-size:19px;fill:#17324d;font-weight:600">密度 ρ＝質量 m ÷ 體積 V；是每單位體積的質量。</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="500" fill="#52677d" x="40" y="538" text-anchor="start" style="font-size:16px;fill:#52677d;font-weight:500">圓點僅是質量比較符號，不代表實際原子數；同材質、同狀態下切割不改密度。</text></svg>