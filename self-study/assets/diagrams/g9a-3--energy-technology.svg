<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="能源與科技"><rect width="960" height="560" fill="#ffffff"></rect><rect width="6" height="44" x="28" y="25" rx="3" ry="3" fill="#087f83"></rect><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="25" font-weight="700" fill="#17324d" x="48" y="48" text-anchor="start" style="font-size:25px;fill:#17324d;font-weight:700">能源與科技</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="500" fill="#52677d" x="48" y="78" text-anchor="start" style="font-size:16px;fill:#52677d;font-weight:500">先比較相同條件，再找差異</text><rect width="278" height="302" x="187.5" y="128" rx="16" ry="16" fill="#f5f9fc" stroke-width="1" stroke="#dce6ee"></rect><circle r="14" cx="213.5" cy="156" fill="#087f83"></circle><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="700" fill="white" x="213.5" y="162" text-anchor="middle" style="font-size:16px;fill:white;font-weight:700">1</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19" font-weight="500" fill="#17324d" x="236.5" y="163" text-anchor="start" style="font-size:19px;fill:#17324d;font-weight:500">效率</text><line x1="209.5" y1="190" x2="443.5" y2="190" stroke-linecap="round" stroke-width="1" stroke="#bdcddd"></line><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18" font-weight="500" fill="#52677d" x="209.5" y="224" text-anchor="start" style="font-size:18px;fill:#52677d;font-weight:500">效率小於 100% 不違反</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18" font-weight="500" fill="#52677d" x="209.5" y="252.8" text-anchor="start" style="font-size:18px;fill:#52677d;font-weight:500">守恆，代表有用輸出只占總輸</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18" font-weight="500" fill="#52677d" x="209.5" y="281.6" text-anchor="start" style="font-size:18px;fill:#52677d;font-weight:500">入的一部分。</text><rect width="278" height="302" x="494.5" y="128" rx="16" ry="16" fill="#f5f9fc" stroke-width="1" stroke="#dce6ee"></rect><circle r="14" cx="520.5" cy="156" fill="#087f83"></circle><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="700" fill="white" x="520.5" y="162" text-anchor="middle" style="font-size:16px;fill:white;font-weight:700">2</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19" font-weight="500" fill="#17324d" x="543.5" y="163" text-anchor="start" style="font-size:19px;fill:#17324d;font-weight:500">儲能與能源來源</text><line x1="516.5" y1="190" x2="750.5" y2="190" stroke-linecap="round" stroke-width="1" stroke="#bdcddd"></line><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18" font-weight="500" fill="#52677d" x="516.5" y="224" text-anchor="start" style="font-size:18px;fill:#52677d;font-weight:500">電池與抽蓄要先充入能量，不</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18" font-weight="500" fill="#52677d" x="516.5" y="252.8" text-anchor="start" style="font-size:18px;fill:#52677d;font-weight:500">能把它們當作永遠自行供能的</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18" font-weight="500" fill="#52677d" x="516.5" y="281.6" text-anchor="start" style="font-size:18px;fill:#52677d;font-weight:500">來源。</text><line x1="32" y1="475" x2="928" y2="475" stroke-linecap="round" stroke-width="2" stroke="#bdcddd"></line><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19" font-weight="600" fill="#17324d" x="40" y="507" text-anchor="start" style="font-size:19px;fill:#17324d;font-weight:600">用自己的話說明每一格之間的關係。</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="500" fill="#52677d" x="40" y="538" text-anchor="start" style="font-size:16px;fill:#52677d;font-weight:500">箭頭表示順序或因果；並不代表物質必定只往單一方向變化。</text></svg>