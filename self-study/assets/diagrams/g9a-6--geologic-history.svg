<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="地層事件：先沉積，再斷裂，後覆蓋"><rect width="960" height="560" fill="#ffffff"></rect><rect width="6" height="44" x="28" y="25" rx="3" ry="3" fill="#087f83"></rect><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="25" font-weight="700" fill="#17324d" x="48" y="48" text-anchor="start" style="font-size:25px;fill:#17324d;font-weight:700">地層事件：先沉積，再斷裂，後覆蓋</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="500" fill="#52677d" x="48" y="78" text-anchor="start" style="font-size:16px;fill:#52677d;font-weight:500">觀察圖中的標示，再對照下方重點</text><rect width="375" height="72" x="83" y="212" fill="#e6d4ab" stroke-width="2" stroke="white"></rect><rect width="375" height="72" x="463" y="233" fill="#e6d4ab" stroke-width="2" stroke="white"></rect><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="20" font-weight="500" fill="#17324d" x="116" y="256" text-anchor="start" style="font-size:20px;fill:#17324d;font-weight:500">較新 C</text><rect width="375" height="72" x="83" y="284" fill="#c5d8d5" stroke-width="2" stroke="white"></rect><rect width="375" height="72" x="463" y="297" fill="#c5d8d5" stroke-width="2" stroke="white"></rect><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="20" font-weight="500" fill="#17324d" x="116" y="328" text-anchor="start" style="font-size:20px;fill:#17324d;font-weight:500">中間 B</text><rect width="375" height="72" x="83" y="356" fill="#adc1d0" stroke-width="2" stroke="white"></rect><rect width="375" height="72" x="463" y="361" fill="#adc1d0" stroke-width="2" stroke="white"></rect><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="20" font-weight="500" fill="#17324d" x="116" y="400" text-anchor="start" style="font-size:20px;fill:#17324d;font-weight:500">較老 A</text><path d="M433 435L512 210" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-width="4" stroke="#bb3f4e"></path><rect width="755" height="66" x="83" y="145" fill="#e9eee3" stroke-width="2" stroke="white"></rect><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="21" font-weight="500" fill="#17324d" x="114" y="187" text-anchor="start" style="font-size:21px;fill:#17324d;font-weight:500">D：未被斷層切過的新沉積層</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="21" font-weight="500" fill="#bb3f4e" x="558" y="349" text-anchor="start" style="font-size:21px;fill:#bb3f4e;font-weight:500">斷層切過 A、B、C</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="21" font-weight="500" fill="#bb3f4e" x="558" y="391" text-anchor="start" style="font-size:21px;fill:#bb3f4e;font-weight:500">卻沒有切過 D</text><line x1="32" y1="475" x2="928" y2="475" stroke-linecap="round" stroke-width="2" stroke="#bdcddd"></line><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19" font-weight="600" fill="#17324d" x="40" y="507" text-anchor="start" style="font-size:19px;fill:#17324d;font-weight:600">事件順序：A → B → C 沉積 → 斷層 → D 沉積。</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="500" fill="#52677d" x="40" y="538" text-anchor="start" style="font-size:16px;fill:#52677d;font-weight:500">在未倒轉地層中，下老上新；切過地層的構造晚於被切過的地層。</text></svg>