 TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="21" font-weight="500" fill="#176ca4" x="174" y="117" text-anchor="start" style="font-size:21px;fill:#176ca4;font-weight:500">海洋板塊</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="21" font-weight="500" fill="#c4671d" x="703" y="117" text-anchor="start" style="font-size:21px;fill:#c4671d;font-weight:500">上覆板塊</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19" font-weight="500" fill="#17324d" x="353" y="201" text-anchor="start" style="font-size:19px;fill:#17324d;font-weight:500">海溝</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19" font-weight="500" fill="#c4671d" x="696" y="336" text-anchor="start" style="font-size:19px;fill:#c4671d;font-weight:500">岩漿上升</text><line x1="687" y1="328" x2="644" y2="305" stroke-linecap="round" stroke-width="1.5" stroke="#c4671d"></line><circle r="5" cx="446" cy="277" fill="#bb3f4e" stroke-width="2" stroke="white"></circle><circle r="5" cx="489" cy="310" fill="#bb3f4e" stroke-width="2" stroke="white"></circle><circle r="5" cx="532" cy="343" fill="#bb3f4e" stroke-width="2" stroke="white"></circle><circle r="5" cx="575" cy="376" fill="#bb3f4e" stroke-width="2" stroke="white"></circle><circle r="5" cx="618" cy="409" fill="#bb3f4e" stroke-width="2" stroke="white"></circle><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="20" font-weight="500" fill="#bb3f4e" x="106" y="362" text-anchor="start" style="font-size:20px;fill:#bb3f4e;font-weight:500">地震沿隱沒帶分布</text><line x1="313" y1="354" x2="495" y2="320" stroke-linecap="round" stroke-width="1.5" stroke="#bb3f4e"></line><line x1="32" y1="475" x2="928" y2="475" stroke-linecap="round" stroke-width="2" stroke="#bdcddd"></line><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19" font-weight="600" fill="#17324d" x="40" y="507" text-anchor="start" style="font-size:19px;fill:#17324d;font-weight:600">密度較大的海洋板塊隱沒，交界附近可能出現地震與火山活動。</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="500" fill="#52677d" x="40" y="538" text-anchor="start" style="font-size:16px;fill:#52677d;font-weight:500">這是一種聚合邊界示意；板塊、地殼與岩漿深度均未按比例。</text></svg>