<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="無摩擦滑道中的能量轉換"><rect width="960" height="560" fill="#ffffff"></rect><rect width="6" height="44" x="28" y="25" rx="3" ry="3" fill="#087f83"></rect><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="25" font-weight="700" fill="#17324d" x="48" y="48" text-anchor="start" style="font-size:25px;fill:#17324d;font-weight:700">無摩擦滑道中的能量轉換</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="500" fill="#52677d" x="48" y="78" text-anchor="start" style="font-size:16px;fill:#52677d;font-weight:500">觀察圖中的標示，再對照下方重點</text><path d="M100 156L690 424H100Z" fill="#edf4f8" stroke-linejoin="round" stroke-linecap="round" stroke-width="2" stroke="#b6cbd9"></path><line x1="90" y1="425" x2="896" y2="425" stroke-linecap="round" stroke-width="3" stroke="#52677d"></line><circle r="23" cx="336" cy="241.2" fill="#c4671d" stroke-width="2" stroke="white"></circle><line x1="336" y1="263.2" x2="336" y2="424" stroke-linecap="round" stroke-width="1.5" stroke="#c4671d" stroke-dasharray="5 5"></line><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="20" font-weight="500" fill="#c4671d" x="364" y="321.2" text-anchor="start" style="font-size:20px;fill:#c4671d;font-weight:500">h＝6 m</text><line x1="331" y1="241" x2="420" y2="281" stroke-linecap="round" stroke-width="3" stroke="#176ca4"></line><polygon points="420,281 410.03010405463766,281.7753546534635 413.96080378762997,273.0295477475556" fill="#176ca4"></polygon><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="23" font-weight="500" fill="#17324d" x="523" y="159" text-anchor="start" style="font-size:23px;fill:#17324d;font-weight:500">高度降低</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="20" font-weight="500" fill="#176ca4" x="523" y="198" text-anchor="start" style="font-size:20px;fill:#176ca4;font-weight:500">重力位能減少</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="20" font-weight="500" fill="#c4671d" x="523" y="236" text-anchor="start" style="font-size:20px;fill:#c4671d;font-weight:500">動能（與內能）增加</text><line x1="32" y1="475" x2="928" y2="475" stroke-linecap="round" stroke-width="2" stroke="#bdcddd"></line><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19" font-weight="600" fill="#17324d" x="40" y="507" text-anchor="start" style="font-size:19px;fill:#17324d;font-weight:600">無摩擦：重力位能＋動能保持不變；有摩擦：也要計入內能。</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="500" fill="#52677d" x="40" y="538" text-anchor="start" style="font-size:16px;fill:#52677d;font-weight:500">球的位置表示高度，尺寸未按比例；計算假設及數值見旁邊的實驗讀數。</text></svg>