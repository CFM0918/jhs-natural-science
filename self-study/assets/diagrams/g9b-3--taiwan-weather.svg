<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="暖濕氣流遇山形成地形雨"><rect width="960" height="560" fill="#ffffff"></rect><rect width="6" height="44" x="28" y="25" rx="3" ry="3" fill="#087f83"></rect><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="25" font-weight="700" fill="#17324d" x="48" y="48" text-anchor="start" style="font-size:25px;fill:#17324d;font-weight:700">暖濕氣流遇山形成地形雨</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="500" fill="#52677d" x="48" y="78" text-anchor="start" style="font-size:16px;fill:#52677d;font-weight:500">觀察圖中的標示，再對照下方重點</text><path d="M64 418L485 193L787 418Z" fill="#d5e2d5" stroke-linejoin="round" stroke-linecap="round" stroke-width="2" stroke="#76957d"></path><path d="M373.25 183C339.25 178.75 349.45 140.5 384.3 145.6C391.95 102.25 449.75 106.5 460.8 143.9C505 137.95 508.4 188.1 472.7 188.1Z" fill="#eef4f8" stroke-linejoin="round" stroke-linecap="round" stroke-width="2" stroke="#bdcddd"></path><line x1="90" y1="316" x2="258" y2="276" stroke-linecap="round" stroke-width="4" stroke="#176ca4"></line><polygon points="258,276 250.57327025949027,282.6965427917268 248.3523743383805,273.36877992306586" fill="#176ca4"></polygon><line x1="262" y1="273" x2="420" y2="188" stroke-linecap="round" stroke-width="4" stroke="#176ca4"></line><polygon points="420,188 414.5429310383217,196.3797612345154 410.000207118261,187.93563912428505" fill="#176ca4"></polygon><line x1="555" y1="257" x2="765" y2="350" stroke-linecap="round" stroke-width="4" stroke="#c4671d"></line><polygon points="765,350 755.0345097864656,350.83006313250917 758.9171486169558,342.06281416043464" fill="#c4671d"></polygon><line x1="341" y1="207" x2="330" y2="237" stroke-linecap="round" stroke-width="2" stroke="#176ca4"></line><line x1="365" y1="207" x2="354" y2="237" stroke-linecap="round" stroke-width="2" stroke="#176ca4"></line><line x1="389" y1="207" x2="378" y2="237" stroke-linecap="round" stroke-width="2" stroke="#176ca4"></line><line x1="413" y1="207" x2="402" y2="237" stroke-linecap="round" stroke-width="2" stroke="#176ca4"></line><line x1="437" y1="207" x2="426" y2="237" stroke-linecap="round" stroke-width="2" stroke="#176ca4"></line><line x1="461" y1="207" x2="450" y2="237" stroke-linecap="round" stroke-width="2" stroke="#176ca4"></line><line x1="485" y1="207" x2="474" y2="237" stroke-linecap="round" stroke-width="2" stroke="#176ca4"></line><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="23" font-weight="500" fill="#176ca4" x="134" y="252" text-anchor="start" style="font-size:23px;fill:#176ca4;font-weight:500">暖濕氣流</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="20" font-weight="500" fill="#176ca4" x="295" y="365" text-anchor="start" style="font-size:20px;fill:#176ca4;font-weight:500">迎風坡：上升冷卻</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="20" font-weight="500" fill="#c4671d" x="590" y="393" text-anchor="start" style="font-size:20px;fill:#c4671d;font-weight:500">背風坡：下沉增溫</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="20" font-weight="500" fill="#087f83" x="579" y="190" text-anchor="start" style="font-size:20px;fill:#087f83;font-weight:500">水氣凝結 → 降水</text><line x1="32" y1="475" x2="928" y2="475" stroke-linecap="round" stroke-width="2" stroke="#bdcddd"></line><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19" font-weight="600" fill="#17324d" x="40" y="507" text-anchor="start" style="font-size:19px;fill:#17324d;font-weight:600">空氣被地形抬升，膨脹冷卻；達露點後可形成雲與降水。</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="500" fill="#52677d" x="40" y="538" text-anchor="start" style="font-size:16px;fill:#52677d;font-weight:500">迎風坡和背風坡取決於當時風向；不是山的固定某一側永遠下雨。</text></svg>