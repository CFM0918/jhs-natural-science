<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="材料生命週期的提問"><rect width="960" height="560" fill="#ffffff"></rect><rect width="6" height="44" x="28" y="25" rx="3" ry="3" fill="#087f83"></rect><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="25" font-weight="700" fill="#17324d" x="48" y="48" text-anchor="start" style="font-size:25px;fill:#17324d;font-weight:700">材料生命週期的提問</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="500" fill="#52677d" x="48" y="78" text-anchor="start" style="font-size:16px;fill:#52677d;font-weight:500">沿箭頭依序追蹤條件與結果</text><rect width="278" height="302" x="34" y="128" rx="16" ry="16" fill="#f5f9fc" stroke-width="1" stroke="#dce6ee"></rect><circle r="14" cx="60" cy="156" fill="#087f83"></circle><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="700" fill="white" x="60" y="162" text-anchor="middle" style="font-size:16px;fill:white;font-weight:700">1</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19" font-weight="500" fill="#17324d" x="83" y="163" text-anchor="start" style="font-size:19px;fill:#17324d;font-weight:500">原料與製造</text><line x1="56" y1="190" x2="290" y2="190" stroke-linecap="round" stroke-width="1" stroke="#bdcddd"></line><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18" font-weight="500" fill="#52677d" x="56" y="224" text-anchor="start" style="font-size:18px;fill:#52677d;font-weight:500">來源、能耗、排放與添加物。</text><line x1="316" y1="282" x2="336" y2="282" stroke-linecap="round" stroke-width="3" stroke="#087f83"></line><polygon points="336,282 327.22417438109625,286.79425538604204 327.22417438109625,277.20574461395796" fill="#087f83"></polygon><rect width="278" height="302" x="341" y="128" rx="16" ry="16" fill="#f5f9fc" stroke-width="1" stroke="#dce6ee"></rect><circle r="14" cx="367" cy="156" fill="#087f83"></circle><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="700" fill="white" x="367" y="162" text-anchor="middle" style="font-size:16px;fill:white;font-weight:700">2</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19" font-weight="500" fill="#17324d" x="390" y="163" text-anchor="start" style="font-size:19px;fill:#17324d;font-weight:500">使用階段</text><line x1="363" y1="190" x2="597" y2="190" stroke-linecap="round" stroke-width="1" stroke="#bdcddd"></line><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18" font-weight="500" fill="#52677d" x="363" y="224" text-anchor="start" style="font-size:18px;fill:#52677d;font-weight:500">功能、耐用次數與是否替代更</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18" font-weight="500" fill="#52677d" x="363" y="252.8" text-anchor="start" style="font-size:18px;fill:#52677d;font-weight:500">多一次用品。</text><line x1="623" y1="282" x2="643" y2="282" stroke-linecap="round" stroke-width="3" stroke="#087f83"></line><polygon points="643,282 634.2241743810963,286.79425538604204 634.2241743810963,277.20574461395796" fill="#087f83"></polygon><rect width="278" height="302" x="648" y="128" rx="16" ry="16" fill="#f5f9fc" stroke-width="1" stroke="#dce6ee"></rect><circle r="14" cx="674" cy="156" fill="#087f83"></circle><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="700" fill="white" x="674" y="162" text-anchor="middle" style="font-size:16px;fill:white;font-weight:700">3</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19" font-weight="500" fill="#17324d" x="697" y="163" text-anchor="start" style="font-size:19px;fill:#17324d;font-weight:500">收集與處理</text><line x1="670" y1="190" x2="904" y2="190" stroke-linecap="round" stroke-width="1" stroke="#bdcddd"></line><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18" font-weight="500" fill="#52677d" x="670" y="224" text-anchor="start" style="font-size:18px;fill:#52677d;font-weight:500">當地能否分類、再生、堆肥或</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18" font-weight="500" fill="#52677d" x="670" y="252.8" text-anchor="start" style="font-size:18px;fill:#52677d;font-weight:500">安全處置。</text><line x1="32" y1="475" x2="928" y2="475" stroke-linecap="round" stroke-width="2" stroke="#bdcddd"></line><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19" font-weight="600" fill="#17324d" x="40" y="507" text-anchor="start" style="font-size:19px;fill:#17324d;font-weight:600">用自己的話說明每一格之間的關係。</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="500" fill="#52677d" x="40" y="538" text-anchor="start" style="font-size:16px;fill:#52677d;font-weight:500">箭頭表示順序或因果；並不代表物質必定只往單一方向變化。</text></svg>