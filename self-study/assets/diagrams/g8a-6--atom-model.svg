nchor="start" style="font-size:22px;fill:#17324d;font-weight:700">電子 e⁻  6 個</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="17" font-weight="500" fill="#52677d" x="564" y="395" text-anchor="start" style="font-size:17px;fill:#52677d;font-weight:500">電荷數＝質子數－電子數</text><line x1="32" y1="475" x2="928" y2="475" stroke-linecap="round" stroke-width="2" stroke="#bdcddd"></line><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19" font-weight="600" fill="#17324d" x="40" y="507" text-anchor="start" style="font-size:19px;fill:#17324d;font-weight:600">原子核包含 6 個質子與 6 個中子；核外以圓點表示 6 個電子。</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="500" fill="#52677d" x="40" y="538" text-anchor="start" style="font-size:16px;fill:#52677d;font-weight:500">電子區域、粒子大小與距離為示意，虛線不是電子的真實運動軌道。</text></svg>