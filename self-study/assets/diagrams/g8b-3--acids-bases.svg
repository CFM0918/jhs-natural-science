mily="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18" font-weight="500" fill="#17324d" x="660" y="313" text-anchor="middle" style="font-size:18px;fill:#17324d;font-weight:500">10</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18" font-weight="500" fill="#17324d" x="720" y="313" text-anchor="middle" style="font-size:18px;fill:#17324d;font-weight:500">11</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18" font-weight="500" fill="#17324d" x="780" y="313" text-anchor="middle" style="font-size:18px;fill:#17324d;font-weight:500">12</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18" font-weight="500" fill="#17324d" x="840" y="313" text-anchor="middle" style="font-size:18px;fill:#17324d;font-weight:500">13</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18" font-weight="500" fill="#17324d" x="900" y="313" text-anchor="middle" style="font-size:18px;fill:#17324d;font-weight:500">14</text><line x1="480" y1="164" x2="480" y2="208" stroke-linecap="round" stroke-width="3" stroke="#17324d"></line><polygon points="480,208 475.20574461395796,199.22417438109628 484.79425538604204,199.22417438109628" fill="#17324d"></polygon><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="22" font-weight="700" fill="#17324d" x="480" y="146" text-anchor="middle" style="font-size:22px;fill:#17324d;font-weight:700">pH 7</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="22" font-weight="500" fill="#bb3f4e" x="211" y="374" text-anchor="middle" style="font-size:22px;fill:#bb3f4e;font-weight:500">酸性：H⁺ 較多</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="22" font-weight="500" fill="#087f83" x="480" y="374" text-anchor="middle" style="font-size:22px;fill:#087f83;font-weight:500">中性</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="22" font-weight="500" fill="#176ca4" x="750" y="374" text-anchor="middle" style="font-size:22px;fill:#176ca4;font-weight:500">鹼性：OH⁻ 較多</text><line x1="32" y1="475" x2="928" y2="475" stroke-linecap="round" stroke-width="2" stroke="#bdcddd"></line><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19" font-weight="600" fill="#17324d" x="40" y="507" text-anchor="start" style="font-size:19px;fill:#17324d;font-weight:600">25°C 的水溶液：pH＜7 為酸性，pH＝7 為中性，pH＞7 為鹼性。</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="500" fill="#52677d" x="40" y="538" text-anchor="start" style="font-size:16px;fill:#52677d;font-weight:500">pH 不是把兩杯溶液的數值直接平均；中和後仍可能含可導電的離子。</text></svg>