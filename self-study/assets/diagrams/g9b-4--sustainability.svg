"256" y2="282" stroke-linecap="round" stroke-width="3" stroke="#087f83"></line><polygon points="256,282 247.22417438109628,286.79425538604204 247.22417438109628,277.20574461395796" fill="#087f83"></polygon><rect width="208" height="302" x="261" y="128" rx="16" ry="16" fill="#f5f9fc" stroke-width="1" stroke="#dce6ee"></rect><circle r="14" cx="287" cy="156" fill="#087f83"></circle><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="700" fill="white" x="287" y="162" text-anchor="middle" style="font-size:16px;fill:white;font-weight:700">2</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19" font-weight="500" fill="#17324d" x="310" y="163" text-anchor="start" style="font-size:19px;fill:#17324d;font-weight:500">提出方案</text><line x1="283" y1="190" x2="447" y2="190" stroke-linecap="round" stroke-width="1" stroke="#bdcddd"></line><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18" font-weight="500" fill="#52677d" x="283" y="224" text-anchor="start" style="font-size:18px;fill:#52677d;font-weight:500">同時設計減緩、調適</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18" font-weight="500" fill="#52677d" x="283" y="252.8" text-anchor="start" style="font-size:18px;fill:#52677d;font-weight:500">與公平配套。</text><line x1="473" y1="282" x2="486" y2="282" stroke-linecap="round" stroke-width="3" stroke="#087f83"></line><polygon points="486,282 477.22417438109625,286.79425538604204 477.22417438109625,277.20574461395796" fill="#087f83"></polygon><rect width="208" height="302" x="491" y="128" rx="16" ry="16" fill="#f5f9fc" stroke-width="1" stroke="#dce6ee"></rect><circle r="14" cx="517" cy="156" fill="#087f83"></circle><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="700" fill="white" x="517" y="162" text-anchor="middle" style="font-size:16px;fill:white;font-weight:700">3</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19" font-weight="500" fill="#17324d" x="540" y="163" text-anchor="start" style="font-size:19px;fill:#17324d;font-weight:500">量測結果</text><line x1="513" y1="190" x2="677" y2="190" stroke-linecap="round" stroke-width="1" stroke="#bdcddd"></line><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18" font-weight="500" fill="#52677d" x="513" y="224" text-anchor="start" style="font-size:18px;fill:#52677d;font-weight:500">比較基準線、成本、</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18" font-weight="500" fill="#52677d" x="513" y="252.8" text-anchor="start" style="font-size:18px;fill:#52677d;font-weight:500">效益與副作用。</text><line x1="703" y1="282" x2="716" y2="282" stroke-linecap="round" stroke-width="3" stroke="#087f83"></line><polygon points="716,282 707.2241743810963,286.79425538604204 707.2241743810963,277.20574461395796" fill="#087f83"></polygon><rect width="208" height="302" x="721" y="128" rx="16" ry="16" fill="#f5f9fc" stroke-width="1" stroke="#dce6ee"></rect><circle r="14" cx="747" cy="156" fill="#087f83"></circle><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="700" fill="white" x="747" y="162" text-anchor="middle" style="font-size:16px;fill:white;font-weight:700">4</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19" font-weight="500" fill="#17324d" x="770" y="163" text-anchor="start" style="font-size:19px;fill:#17324d;font-weight:500">持續修正</text><line x1="743" y1="190" x2="907" y2="190" stroke-linecap="round" stroke-width="1" stroke="#bdcddd"></line><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18" font-weight="500" fill="#52677d" x="743" y="224" text-anchor="start" style="font-size:18px;fill:#52677d;font-weight:500">公開方法與不確定性</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="18" font-weight="500" fill="#52677d" x="743" y="252.8" text-anchor="start" style="font-size:18px;fill:#52677d;font-weight:500">，依新證據改善。</text><line x1="32" y1="475" x2="928" y2="475" stroke-linecap="round" stroke-width="2" stroke="#bdcddd"></line><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="19" font-weight="600" fill="#17324d" x="40" y="507" text-anchor="start" style="font-size:19px;fill:#17324d;font-weight:600">用自己的話說明每一格之間的關係。</text><text font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="16" font-weight="500" fill="#52677d" x="40" y="538" text-anchor="start" style="font-size:16px;fill:#52677d;font-weight:500">箭頭表示順序或因果；並不代表物質必定只往單一方向變化。</text></svg>