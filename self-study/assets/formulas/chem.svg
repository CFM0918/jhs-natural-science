<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="加水前後食鹽都是 10 g；加 100 g 水後，溶液總質量由 100 g 變為 200 g，濃度由 10% 降為 5%。水量與溶液質量要分清楚。"><rect width="960" height="560" fill="#ffffff"></rect><text x="40" y="49" text-anchor="start" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:29px;fill:#17324d;font-weight:500">化學的量與比例｜看圖選關係</text><text x="40" y="83" text-anchor="start" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:17px;fill:#52677d;font-weight:500">原創國中圖解・示意圖不代表實際尺寸</text><line x1="40" y1="105" x2="920" y2="105" stroke-linecap="round" stroke-width="1" stroke="#bdcddd"></line><rect width="132" height="90" x="104" y="298" fill="#c3e6f3"></rect><path d="M100 178V388H240V178" fill="none" stroke-width="3" stroke="#176ca4"></path><line x1="104" y1="298" x2="236" y2="298" stroke-linecap="round" stroke-width="3" stroke="#087f83"></line><text x="170" y="424" text-anchor="middle" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:22px;fill:#17324d;font-weight:500">100 g 溶液</text><rect width="132" height="180" x="684" y="208" fill="#c3e6f3"></rect><path d="M680 178V388H820V178" fill="none" stroke-width="3" stroke="#176ca4"></path><line x1="684" y1="208" x2="816" y2="208" stroke-linecap="round" stroke-width="3" stroke="#087f83"></line><text x="750" y="424" text-anchor="middle" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:22px;fill:#17324d;font-weight:500">200 g 溶液</text><text x="170" y="266" text-anchor="middle" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:20px;fill:#17324d;font-weight:500">食鹽 10 g</text><text x="750" y="254" text-anchor="middle" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:20px;fill:#17324d;font-weight:500">食鹽 10 g</text><line x1="290" y1="280" x2="620" y2="280" stroke-linecap="round" stroke-width="3" stroke="#176ca4"></line><polygon points="620,280 608.5914266954252,286.2325320018546 608.5914266954252,273.7674679981454" fill="#176ca4"></polygon><text x="455" y="243" text-anchor="middle" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:24px;fill:#087f83;font-weight:500">只加 100 g 水</text><text x="170" y="478" text-anchor="middle" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:23px;fill:#17324d;font-weight:500">10 ÷ 100 = 10%</text><text x="750" y="478" text-anchor="middle" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:23px;fill:#17324d;font-weight:500">10 ÷ 200 = 5%</text><text x="455" y="339" text-anchor="middle" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:24px;fill:#b35b13;font-weight:500">溶質不變</text></svg>