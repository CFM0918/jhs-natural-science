<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="水平方向的 10 N 推力使物體前進 3 m，這個推力作功 30 J。若花 5 s，平均功率為 6 W；圖中的力是所討論的推力，不一定是合力。"><rect width="960" height="560" fill="#ffffff"></rect><text x="40" y="49" text-anchor="start" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:29px;fill:#17324d;font-weight:500">功與能量｜看圖選關係</text><text x="40" y="83" text-anchor="start" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:17px;fill:#52677d;font-weight:500">原創國中圖解・示意圖不代表實際尺寸</text><line x1="40" y1="105" x2="920" y2="105" stroke-linecap="round" stroke-width="1" stroke="#bdcddd"></line><rect width="130" height="100" x="170" y="230" rx="8" ry="8" fill="#e5f3f7" stroke-width="2" stroke="#176ca4"></rect><rect width="130" height="100" x="510" y="230" fill="none" stroke-dasharray="6 6" stroke-width="2" stroke="#bdcddd"></rect><line x1="80" y1="341" x2="660" y2="341" stroke-linecap="round" stroke-width="3" stroke="#52677d"></line><line x1="225" y1="205" x2="363" y2="205" stroke-linecap="round" stroke-width="3" stroke="#176ca4"></line><polygon points="363,205 351.5914266954251,211.23253200185465 351.5914266954251,198.76746799814535" fill="#176ca4"></polygon><text x="230" y="170" text-anchor="start" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:24px;fill:#176ca4;font-weight:500">推力 10 N</text><line x1="235" y1="389" x2="575" y2="389" stroke-linecap="round" stroke-width="3" stroke="#087f83"></line><polygon points="575,389 563.5914266954252,395.2325320018546 563.5914266954252,382.7674679981454" fill="#087f83"></polygon><text x="400" y="426" text-anchor="middle" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:23px;fill:#087f83;font-weight:500">同方向位移 3 m</text><text x="690" y="234" text-anchor="start" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:23px;fill:#087f83;font-weight:500">功：</text><text x="690" y="274" text-anchor="start" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:22px;fill:#17324d;font-weight:500">10 × 3 = 30 J</text><text x="690" y="350" text-anchor="start" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:23px;fill:#087f83;font-weight:500">若花 5 s：</text><text x="690" y="390" text-anchor="start" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:22px;fill:#17324d;font-weight:500">30 ÷ 5 = 6 W</text><text x="80" y="485" text-anchor="start" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:23px;fill:#17324d;font-weight:500">每秒作功越多，功率越大；功率不是總作功量。</text></svg>