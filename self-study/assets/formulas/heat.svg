<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="等質量、同為水，且不散熱、不計容器吸熱時，80°C 與 20°C 的水最後同為 50°C。熱量由高溫水傳向低溫水。"><rect width="960" height="560" fill="#ffffff"></rect><text x="40" y="49" text-anchor="start" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:29px;fill:#17324d;font-weight:500">溫度與熱量｜看圖選關係</text><text x="40" y="83" text-anchor="start" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:17px;fill:#52677d;font-weight:500">原創國中圖解・示意圖不代表實際尺寸</text><line x1="40" y1="105" x2="920" y2="105" stroke-linecap="round" stroke-width="1" stroke="#bdcddd"></line><rect width="162" height="120" x="89" y="267" fill="#c3e6f3"></rect><path d="M85 197V387H255V197" fill="none" stroke-width="3" stroke="#176ca4"></path><line x1="89" y1="267" x2="251" y2="267" stroke-linecap="round" stroke-width="3" stroke="#087f83"></line><text x="170" y="423" text-anchor="middle" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:22px;fill:#17324d;font-weight:500">100 g 水・80°C</text><rect width="162" height="120" x="699" y="267" fill="#c3e6f3"></rect><path d="M695 197V387H865V197" fill="none" stroke-width="3" stroke="#176ca4"></path><line x1="699" y1="267" x2="861" y2="267" stroke-linecap="round" stroke-width="3" stroke="#087f83"></line><text x="780" y="423" text-anchor="middle" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:22px;fill:#17324d;font-weight:500">100 g 水・20°C</text><line x1="298" y1="248" x2="645" y2="248" stroke-linecap="round" stroke-width="3" stroke="#b35b13"></line><polygon points="645,248 633.5914266954252,254.23253200185465 633.5914266954252,241.76746799814535" fill="#b35b13"></polygon><text x="480" y="218" text-anchor="middle" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:24px;fill:#b35b13;font-weight:500">熱量由高溫傳向低溫</text><text x="480" y="316" text-anchor="middle" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:25px;fill:#17324d;font-weight:500">各改變 30°C</text><rect width="260" height="65" x="350" y="350" rx="8" ry="8" fill="#e5f3f7" stroke-width="2" stroke="#176ca4"></rect><text x="480" y="392" text-anchor="middle" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:25px;fill:#087f83;font-weight:500">最後同為 50°C</text><text x="480" y="486" text-anchor="middle" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:23px;fill:#17324d;font-weight:500">等質量的同種物質，才可在本例直接平均溫度。</text></svg>