<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="液面由 35 mL 升至 47 mL，增加 12 mL。物體完全浸沒時，體積為 12 cm³；若質量為 32.4 g，密度為 2.7 g/cm³。"><rect width="960" height="560" fill="#ffffff"></rect><text x="40" y="49" text-anchor="start" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:29px;fill:#17324d;font-weight:500">測量與密度｜看圖選關係</text><text x="40" y="83" text-anchor="start" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:17px;fill:#52677d;font-weight:500">原創國中圖解・示意圖不代表實際尺寸</text><line x1="40" y1="105" x2="920" y2="105" stroke-linecap="round" stroke-width="1" stroke="#bdcddd"></line><rect width="102" height="140" x="104" y="265" fill="#c3e6f3"></rect><path d="M100 160V405H210V160" fill="none" stroke-width="3" stroke="#176ca4"></path><line x1="104" y1="265" x2="206" y2="265" stroke-linecap="round" stroke-width="3" stroke="#087f83"></line><text x="155" y="441" text-anchor="middle" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:22px;fill:#17324d;font-weight:500">35 mL</text><rect width="102" height="188" x="344" y="217" fill="#c3e6f3"></rect><path d="M340 160V405H450V160" fill="none" stroke-width="3" stroke="#176ca4"></path><line x1="344" y1="217" x2="446" y2="217" stroke-linecap="round" stroke-width="3" stroke="#087f83"></line><text x="395" y="441" text-anchor="middle" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:22px;fill:#17324d;font-weight:500">47 mL</text><rect width="56" height="55" x="367" y="329" rx="8" ry="8" fill="#f5ca91" stroke-width="2" stroke="#176ca4"></rect><line x1="242" y1="253" x2="300" y2="253" stroke-linecap="round" stroke-width="3" stroke="#176ca4"></line><polygon points="300,253 288.5914266954251,259.2325320018546 288.5914266954251,246.76746799814535" fill="#176ca4"></polygon><text x="240" y="224" text-anchor="start" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:18px;fill:#17324d;font-weight:500">放入</text><text x="505" y="199" text-anchor="start" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:24px;fill:#087f83;font-weight:500">① 算液面增加量</text><text x="505" y="244" text-anchor="start" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:22px;fill:#17324d;font-weight:500">47 − 35 = 12 mL</text><text x="505" y="304" text-anchor="start" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:24px;fill:#087f83;font-weight:500">② 連結體積與密度</text><text x="505" y="349" text-anchor="start" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:22px;fill:#17324d;font-weight:500">V = 12 cm³，m = 32.4 g</text><text x="505" y="394" text-anchor="start" style="font-family:Microsoft JhengHei,Noto Sans CJK TC,sans-serif;font-size:22px;fill:#17324d;font-weight:500">ρ = 32.4 ÷ 12 = 2.7 g/cm³</text></svg>